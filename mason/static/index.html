<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c2230">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MASON">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/icon-192.png">
<title>Escritório Virtual · MASON</title>
<style>
  :root {
    --bg: #f5f6f8; --panel: #fff; --ink: #1c2230; --muted: #6b7385; --line: #e3e6ec;
    --accent: #2f5bd3; --ok: #1f8a4c; --warn: #b7791f; --bad: #c53030; --info: #6b46c1;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: var(--bg); }
  header { display: flex; align-items: center; gap: 16px; padding: 12px 20px; background: var(--ink); color: #fff; }
  header h1 { font-size: 17px; margin: 0; letter-spacing: .3px; }
  header .sub { color: #aab3c5; font-size: 12px; }
  header .spacer { flex: 1; }
  button { font: inherit; border: 1px solid var(--line); background: #fff; color: var(--ink); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.ok { background: var(--ok); color: #fff; border-color: var(--ok); }
  button.bad { background: #fff; color: var(--bad); border-color: var(--bad); }
  button:disabled { opacity: .5; cursor: default; }
  header button { background: transparent; color: #fff; border-color: #4a5468; }
  main { display: grid; grid-template-columns: minmax(340px, 34%) 1fr; gap: 16px; padding: 16px; height: calc(100vh - 56px); }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  .panel h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin: 0; padding: 12px 14px 8px; display: flex; align-items: center; gap: 8px; }
  .panel h2 .count { background: var(--bg); color: var(--ink); border-radius: 10px; padding: 0 7px; font-size: 12px; }
  /* chat */
  #chat { display: flex; flex-direction: column; min-height: 0; }
  #msgs { flex: 1; overflow-y: auto; padding: 8px 14px; display: flex; flex-direction: column; gap: 10px; }
  .msg { padding: 9px 12px; border-radius: 10px; max-width: 92%; white-space: normal; word-wrap: break-word; }
  .msg.user { align-self: flex-end; background: var(--accent); color: #fff; }
  .msg.assistant { align-self: flex-start; background: var(--bg); }
  .msg.assistant .who { font-weight: 600; font-size: 12px; color: var(--accent); margin-bottom: 2px; }
  .msg.pending { color: var(--muted); font-style: italic; }
  #chatform { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--line); }
  #chatform textarea { flex: 1; resize: none; height: 64px; font: inherit; padding: 8px; border: 1px solid var(--line); border-radius: 6px; }
  .quick { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 10px 10px; }
  .quick button { font-size: 12px; padding: 3px 9px; border-radius: 12px; color: var(--muted); }
  /* direita */
  #right { overflow-y: auto; display: flex; flex-direction: column; gap: 16px; min-height: 0; }
  #alerts { display: flex; gap: 10px; flex-wrap: wrap; }
  .alert { flex: 1; min-width: 150px; padding: 10px 14px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); }
  .alert .n { font-size: 24px; font-weight: 700; }
  .alert .l { color: var(--muted); font-size: 12px; }
  .alert.hot { border-color: var(--bad); } .alert.hot .n { color: var(--bad); }
  .alert.attn { border-color: var(--warn); } .alert.attn .n { color: var(--warn); }
  #depts { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; padding: 0 14px 14px; }
  .dept { border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
  .dept .name { font-weight: 600; }
  .dept .stats { color: var(--muted); font-size: 12px; margin: 4px 0; }
  .dept .now { font-size: 12px; }
  .dept .now div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #c8cdd8; margin-right: 6px; }
  .dot.on { background: var(--ok); box-shadow: 0 0 0 3px #1f8a4c33; }
  #board { display: grid; grid-template-columns: repeat(5, minmax(150px, 1fr)); gap: 10px; padding: 0 14px 14px; }
  .col { background: var(--bg); border-radius: 8px; padding: 8px; min-height: 80px; }
  .col h3 { margin: 0 0 6px; font-size: 12px; color: var(--muted); font-weight: 600; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; margin-bottom: 6px; cursor: pointer; font-size: 13px; }
  .card:hover { border-color: var(--accent); }
  .card .meta { color: var(--muted); font-size: 11px; margin-top: 3px; display: flex; gap: 6px; flex-wrap: wrap; }
  .tag { border-radius: 4px; padding: 0 5px; font-size: 11px; background: var(--bg); }
  .tag.urgente { background: #fde2e2; color: var(--bad); } .tag.alta { background: #fdf0d9; color: var(--warn); }
  .tag.late { background: var(--bad); color: #fff; }
  .list { padding: 0 14px 14px; }
  .item { border-top: 1px solid var(--line); padding: 9px 0; }
  .item:first-child { border-top: 0; }
  .item .t { font-weight: 600; }
  .item .d { color: var(--muted); font-size: 13px; margin: 3px 0 6px; white-space: pre-wrap; max-height: 120px; overflow: auto; }
  .item .acts { display: flex; gap: 6px; align-items: center; }
  .item input { flex: 1; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; font: inherit; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .empty { color: var(--muted); font-size: 13px; padding: 4px 0; }
  .link { color: var(--accent); cursor: pointer; }
  /* modal */
  #modal { position: fixed; inset: 0; background: #0008; display: none; align-items: center; justify-content: center; padding: 20px; z-index: 10; }
  #modal .box { background: #fff; border-radius: 10px; width: min(900px, 100%); max-height: 90vh; overflow-y: auto; padding: 20px 24px; }
  #modal h2 { margin: 0 0 4px; font-size: 18px; }
  .timeline { border-left: 2px solid var(--line); margin: 8px 0 8px 4px; padding-left: 14px; }
  .timeline div { margin-bottom: 6px; font-size: 13px; }
  .timeline .a { font-weight: 600; } .timeline .w { color: var(--muted); font-size: 11px; }
  .result { background: var(--bg); padding: 12px 14px; border-radius: 8px; }
  .md h1, .md h2, .md h3, .md h4 { font-size: 15px; margin: 10px 0 4px; text-transform: none; letter-spacing: 0; color: var(--ink); padding: 0; }
  .md p { margin: 4px 0; } .md ul, .md ol { margin: 4px 0; padding-left: 20px; }
  .md pre { background: #1c2230; color: #e8ecf3; padding: 10px; border-radius: 6px; overflow-x: auto; font-size: 12px; }
  .md code { background: #e9ecf2; padding: 0 4px; border-radius: 3px; font-size: 12px; }
  .md pre code { background: none; padding: 0; }
  .md table { border-collapse: collapse; } .md td, .md th { border: 1px solid var(--line); padding: 3px 6px; }
  #tabs { display: none; }
  #login { position: fixed; inset: 0; background: var(--ink); display: none; align-items: center; justify-content: center; z-index: 20; padding: 20px; }
  #login form { background: #fff; border-radius: 12px; padding: 28px 24px; width: min(360px, 100%); text-align: center; }
  #login img { width: 72px; height: 72px; border-radius: 16px; }
  #login input { display: block; width: 100%; padding: 12px; font-size: 16px; border: 1px solid var(--line); border-radius: 8px; margin: 12px 0 0; }
  #login input[hidden] { display: none; } #loginErr { margin-top: 10px; }
  #login button { width: 100%; padding: 12px; font-size: 16px; }
  #loginErr { color: var(--bad); min-height: 20px; font-size: 13px; }
  @media (max-width: 1000px) { main { grid-template-columns: 1fr; } #board { grid-template-columns: 1fr 1fr; } .grid2 { grid-template-columns: 1fr; } }
  @media (max-width: 760px) {
    body { height: 100dvh; display: flex; flex-direction: column; padding-bottom: calc(58px + env(safe-area-inset-bottom)); }
    header { flex: none; } header .long { display: none; }
    header { padding: calc(10px + env(safe-area-inset-top)) 12px 10px; gap: 6px; }
    header h1 { font-size: 15px; } header .sub { font-size: 11px; }
    header button { padding: 5px 8px; font-size: 12px; }
    #btnMemory { display: none; }
    main { display: block; padding: 10px; flex: 1; min-height: 0; height: auto; overflow-y: auto; }
    body.tab-chat main { overflow: hidden; }
    #chat { height: 100%; } #right { overflow: visible; }
    #chatform textarea { font-size: 16px; height: 52px; } /* 16px evita zoom automático no iPhone */
    .quick { flex-wrap: nowrap; overflow-x: auto; } .quick button { white-space: nowrap; }
    #board { grid-template-columns: 1fr; }
    .alert { min-width: 30%; padding: 8px 10px; } .alert .n { font-size: 20px; }
    .msg { max-width: 96%; }
    #modal { padding: 0; align-items: stretch; } #modal .box { border-radius: 0; max-height: none; padding-top: calc(16px + env(safe-area-inset-top)); }
    .item .acts { flex-wrap: wrap; } .item input { min-width: 100%; font-size: 16px; }
    body.tab-chat #right, body.tab-painel #chat, body.tab-painel .appr-panel, body.tab-aprovacoes #chat, body.tab-aprovacoes #right > :not(.grid2), body.tab-aprovacoes .rec-panel, body.tab-aprovacoes .grid2:not(.first) { display: none; }
    body.tab-aprovacoes .appr-panel { display: block; }
    #right { gap: 10px; }
    #tabs { display: flex; position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); z-index: 5; }
    #tabs button { flex: 1; border: 0; border-radius: 0; padding: 10px 0 12px; font-size: 12px; color: var(--muted); background: none; position: relative; }
    #tabs button.on { color: var(--accent); font-weight: 600; }
    #tabs .ico { display: block; font-size: 20px; line-height: 1.2; }
    #tabs .badge { position: absolute; top: 4px; left: 55%; background: var(--bad); color: #fff; border-radius: 9px; font-size: 10px; padding: 0 5px; }
  }
</style>
</head>
<body class="tab-chat">
<div id="login"><form id="loginForm">
  <img src="/icon-192.png" alt=""><h2 style="margin:12px 0 0">Escritório Virtual MASON</h2>
  <input type="email" id="email" placeholder="E-mail" autocomplete="username" hidden>
  <input type="password" id="pw" placeholder="Senha" autocomplete="current-password">
  <div id="loginErr"></div><button class="primary" id="loginBtn">Entrar</button>
  <p id="forgotWrap" hidden><a href="#" id="forgot" style="color:var(--muted);font-size:13px">Esqueci minha senha</a></p>
  <p style="color:var(--muted);font-size:12px;margin:14px 0 0">Acesso exclusivo do proprietário.</p>
</form></div>
<header>
  <div>
    <h1><span class="long">Escritório Virtual · </span>MASON</h1>
    <div class="sub" id="sub">carregando…</div>
  </div>
  <div class="spacer"></div>
  <button id="btnReport">Gerar relatório</button>
  <button id="btnMemory">Memória</button>
  <button id="btnSettings">Configurações</button>
</header>
<main>
  <section class="panel" id="chat">
    <h2>Conversa com MASON <span class="spacer" style="flex:1"></span><button id="btnReset" style="font-size:12px;padding:2px 8px">Nova conversa</button></h2>
    <div id="msgs"></div>
    <div class="quick">
      <button>O que está acontecendo na empresa agora?</button>
      <button>O que está atrasado ou bloqueado?</button>
      <button>O que precisa da minha aprovação?</button>
      <button>O que os departamentos estão recomendando?</button>
      <button>Quais são as próximas prioridades?</button>
    </div>
    <form id="chatform">
      <textarea id="input" placeholder="Fale com o MASON: peça um trabalho, uma atualização ou um relatório… (Enter envia, Shift+Enter quebra linha)"></textarea>
      <button class="primary" id="send">Enviar</button>
    </form>
  </section>

  <section id="right">
    <div id="alerts"></div>
    <div class="panel"><h2>Departamentos</h2><div id="depts"></div></div>
    <div class="panel"><h2>Quadro de tarefas</h2><div id="board"></div></div>
    <div class="grid2 first">
      <div class="panel appr-panel"><h2>Aguardando sua aprovação <span class="count" id="nAppr">0</span></h2><div class="list" id="approvals"></div></div>
      <div class="panel rec-panel"><h2>Recomendações dos departamentos <span class="count" id="nRec">0</span></h2><div class="list" id="recs"></div></div>
    </div>
    <div class="grid2">
      <div class="panel"><h2>Relatórios</h2><div class="list" id="reports"></div></div>
      <div class="panel"><h2>Atividade recente</h2><div class="list" id="activity"></div></div>
    </div>
  </section>
</main>

<nav id="tabs">
  <button data-tab="chat" class="on"><span class="ico">💬</span>MASON</button>
  <button data-tab="painel"><span class="ico">🏢</span>Empresa</button>
  <button data-tab="aprovacoes"><span class="ico">✅</span>Aprovações<span class="badge" id="tabBadge" hidden></span></button>
</nav>

<div id="modal"><div class="box" id="modalBox"></div></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const STATUS = {pendente:"Pendente", em_andamento:"Em andamento", bloqueada:"Bloqueada", aguardando_aprovacao:"Aguardando aprovação",
  em_revisao:"Em revisão", concluida:"Concluída", cancelada:"Cancelada", falhou:"Falhou"};
let DEPTS = {};

function md(src) {
  // markdown simples e seguro (escapa tudo antes de formatar)
  const blocks = String(src ?? "").split(/```/);
  return '<div class="md">' + blocks.map((b, i) => {
    if (i % 2) return "<pre><code>" + esc(b.replace(/^\w*\n/, "")) + "</code></pre>";
    const lines = esc(b).split("\n"); let out = "", list = null;
    const inline = t => t.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>");
    const close = () => { if (list) { out += `</${list}>`; list = null; } };
    for (const l of lines) {
      let m;
      if ((m = l.match(/^(#{1,4})\s+(.*)/))) { close(); out += `<h${m[1].length+1}>${inline(m[2])}</h${m[1].length+1}>`; }
      else if ((m = l.match(/^\s*[-*•]\s+(.*)/))) { if (list !== "ul") { close(); out += "<ul>"; list = "ul"; } out += `<li>${inline(m[1])}</li>`; }
      else if ((m = l.match(/^\s*\d+[.)]\s+(.*)/))) { if (list !== "ol") { close(); out += "<ol>"; list = "ol"; } out += `<li>${inline(m[1])}</li>`; }
      else if (l.trim() === "") { close(); }
      else { close(); out += `<p>${inline(l)}</p>`; }
    }
    close(); return out;
  }).join("") + "</div>";
}
const when = iso => iso ? new Date(iso).toLocaleString("pt-BR", {day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit"}) : "";
async function api(path, opts = {}) {
  const r = await fetch(path, {headers: {"Content-Type": "application/json"}, ...opts});
  const data = await r.json().catch(() => ({}));
  if (r.status === 401) { showLogin(); throw new Error("Faça login"); }
  if (!r.ok) throw new Error(data.detail || r.statusText);
  return data;
}

// ---------------- chat
function addMsg(role, text, cls = "") {
  const d = document.createElement("div");
  d.className = `msg ${role} ${cls}`;
  d.innerHTML = role === "assistant" ? `<div class="who">MASON</div>${md(text)}` : esc(text).replace(/\n/g, "<br>");
  $("#msgs").appendChild(d); $("#msgs").scrollTop = 1e9; return d;
}
let chatShown = -1, polling = false;
function renderChat(h) {
  if (h.messages.length === chatShown && !h.busy && !h.error) return;
  $("#msgs").innerHTML = "";
  if (!h.messages.length) addMsg("assistant", "Olá! Sou o MASON, supervisor do escritório. Diga o que precisa: posso distribuir trabalhos aos departamentos, acompanhar o andamento e trazer relatórios.");
  h.messages.forEach(m => addMsg(m.role, m.text));
  if (h.busy) addMsg("assistant", "Analisando…", "pending");
  else if (h.error) addMsg("assistant", "Erro: " + h.error);
  chatShown = h.busy || h.error ? -1 : h.messages.length;
  $("#send").disabled = h.busy;
}
async function loadChat() {
  const h = await api("/api/chat"); renderChat(h);
  if (h.busy) pollChat();
}
async function pollChat() {
  // a resposta é gerada no servidor; aqui só acompanhamos (sobrevive a tela bloqueada e rede instável)
  if (polling) return; polling = true;
  try {
    while (true) {
      await new Promise(r => setTimeout(r, 2000));
      let h; try { h = await api("/api/chat"); } catch (e) { continue; }
      renderChat(h);
      if (!h.busy) { refresh(); break; }
    }
  } finally { polling = false; }
}
async function send(text) {
  text = text.trim(); if (!text) return;
  $("#input").value = ""; $("#send").disabled = true;
  addMsg("user", text); addMsg("assistant", "Analisando…", "pending"); chatShown = -1;
  try { await api("/api/chat", {method: "POST", body: JSON.stringify({message: text})}); }
  catch (e) { addMsg("assistant", "Erro: " + e.message); $("#send").disabled = false; return; }
  pollChat();
}
$("#chatform").onsubmit = e => { e.preventDefault(); send($("#input").value); };
$("#input").onkeydown = e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send($("#input").value); } };
document.querySelectorAll(".quick button").forEach(b => b.onclick = () => send(b.textContent));
$("#btnReset").onclick = async () => { if (confirm("Começar uma nova conversa com o MASON? (a empresa, as tarefas e a memória continuam)")) {
  try { await api("/api/chat/reset", {method: "POST"}); chatShown = -1; loadChat(); } catch (e) { alert(e.message); } } };

// ---------------- painel
function card(t) {
  const late = t.overdue ? '<span class="tag late">atrasada</span>' : "";
  const pr = t.priority !== "media" ? `<span class="tag ${t.priority}">${t.priority}</span>` : "";
  return `<div class="card" onclick="openTask(${t.id})">#${t.id} ${esc(t.title)}
    <div class="meta"><span>${esc(DEPTS[t.department_id] || t.department_id)}</span>${pr}${late}</div></div>`;
}
function render(ov) {
  DEPTS = Object.fromEntries(ov.departments.map(d => [d.id, d.name]));
  const running = new Set(ov.running.filter(k => k.startsWith("task:")).map(k => +k.split(":")[1]));
  $("#sub").textContent = `${ov.running.length ? ov.running.length + " trabalho(s) em execução" : "Nenhum agente trabalhando agora"} · atualizado ${when(ov.now)}`;

  const open = ov.open_tasks;
  const overdue = open.filter(t => t.overdue).length;
  const blocked = open.filter(t => t.status === "bloqueada").length;
  const A = (n, l, cls) => `<div class="alert ${n ? cls : ""}"><div class="n">${n}</div><div class="l">${l}</div></div>`;
  $("#alerts").innerHTML = A(ov.pending_approvals.length, "aguardando sua aprovação", "attn") + A(overdue, "tarefas atrasadas", "hot")
    + A(blocked, "tarefas bloqueadas", "hot") + A(ov.failed.length, "falhas recentes", "hot") + A(open.length, "tarefas abertas", "");

  $("#depts").innerHTML = ov.departments.map(d => {
    const c = d.counts, n = k => c[k] || 0;
    const isOn = d.active.some(t => running.has(t.id));
    return `<div class="dept"><div class="name"><span class="dot ${isOn ? "on" : ""}"></span>${esc(d.name)}</div>
      <div class="stats">${n("pendente") + n("em_andamento")} em fila/andamento · ${n("bloqueada") + n("aguardando_aprovacao")} parada(s) · ${n("concluida")} concluída(s)${d.overdue ? ` · <b style="color:var(--bad)">${d.overdue} atrasada(s)</b>` : ""}</div>
      <div class="now">${d.active.map(t => `<div class="link" onclick="openTask(${t.id})">▸ ${esc(t.title)}</div>`).join("") || '<span class="empty">sem trabalho ativo</span>'}</div></div>`;
  }).join("");

  const cols = [["Pendentes", t => t.status === "pendente"], ["Em andamento", t => t.status === "em_andamento"],
    ["Bloqueadas / aprovação", t => ["bloqueada", "aguardando_aprovacao"].includes(t.status)], ["Em revisão (MASON)", t => t.status === "em_revisao"]];
  $("#board").innerHTML = cols.map(([name, f]) => { const ts = open.filter(f);
    return `<div class="col"><h3>${name} (${ts.length})</h3>${ts.map(card).join("")}</div>`; }).join("")
    + `<div class="col"><h3>Concluídas recentes</h3>${ov.recent_done.map(card).join("")}${ov.failed.length ? `<h3 style="margin-top:8px;color:var(--bad)">Falharam</h3>${ov.failed.map(card).join("")}` : ""}</div>`;

  $("#nAppr").textContent = ov.pending_approvals.length;
  $("#tabBadge").hidden = !ov.pending_approvals.length; $("#tabBadge").textContent = ov.pending_approvals.length;
  const ap = $("#approvals"), typing = ap.contains(document.activeElement);
  if (!typing) ap.innerHTML = ov.pending_approvals.map(a => `<div class="item"><div class="t">${esc(a.title)}</div>
      <div class="d">${esc(a.details)}</div>
      <div class="d">Pedido por ${esc(a.requested_by)}${a.task_id ? ` · <span class="link" onclick="openTask(${a.task_id})">tarefa #${a.task_id}</span>` : ""} · ${when(a.created_at)}</div>
      <div class="acts"><input id="note${a.id}" placeholder="Comentário (opcional)">
      <button class="ok" onclick="decide(${a.id}, true)">Aprovar</button><button class="bad" onclick="decide(${a.id}, false)">Rejeitar</button></div></div>`).join("")
      || '<div class="empty">Nada aguardando você.</div>';

  $("#nRec").textContent = ov.recommendations.length;
  $("#recs").innerHTML = ov.recommendations.map(r => `<div class="item"><div class="t link" onclick="openRec(${r.id})">${esc(r.title)}</div>
      <div class="d">${esc(DEPTS[r.department_id] || r.department_id)}${r.target_department ? " → " + esc(DEPTS[r.target_department] || r.target_department) : ""} · ${when(r.created_at)}</div></div>`).join("")
      || '<div class="empty">Nenhuma recomendação nova.</div>';

  $("#reports").innerHTML = ov.reports.map(r => `<div class="item"><span class="link" onclick="openReport(${r.id})">${esc(r.title)}</span> <span class="d">${when(r.created_at)}</span></div>`).join("")
      || '<div class="empty">Nenhum relatório ainda. Clique em “Gerar relatório”.</div>';
  $("#activity").innerHTML = ov.activity.slice(0, 15).map(a => `<div class="item" style="padding:5px 0"><span class="d">${when(a.created_at)}</span> <b>${esc(a.actor)}</b> ${esc(a.action.replace(/_/g, " "))}: ${esc(a.details)}</div>`).join("")
      || '<div class="empty">Sem atividade ainda.</div>';
  window.SETTINGS = ov.settings;
}
async function refresh() { try { render(await api("/api/overview")); } catch (e) { $("#sub").textContent = "Erro ao atualizar: " + e.message; } }

// ---------------- modais
function modal(html) { $("#modalBox").innerHTML = html + '<p style="text-align:right"><button onclick="closeModal()">Fechar</button></p>'; $("#modal").style.display = "flex"; }
function closeModal() { $("#modal").style.display = "none"; }
$("#modal").onclick = e => { if (e.target.id === "modal") closeModal(); };
async function openTask(id) {
  const t = await api(`/api/tasks/${id}`);
  const closed = ["concluida", "cancelada"].includes(t.status);
  modal(`<h2>#${t.id} ${esc(t.title)}</h2>
    <div class="d" style="color:var(--muted)">${esc(DEPTS[t.department_id])} · ${STATUS[t.status]} · prioridade ${t.priority} · criada por ${esc(t.created_by)} em ${when(t.created_at)}${t.due_at ? " · prazo " + when(t.due_at) : ""}${t.overdue ? ' · <b style="color:var(--bad)">ATRASADA</b>' : ""}</div>
    <h3>Pedido</h3>${md(t.description)}
    ${t.result ? `<h3>Resultado entregue</h3><div class="result">${md(t.result)}</div>` : ""}
    <h3>Histórico</h3><div class="timeline">${t.updates.map(u => `<div><span class="a">${esc(u.author)}</span> <span class="w">${u.kind} · ${when(u.created_at)}</span><br>${esc(u.content)}</div>`).join("")}</div>
    ${closed ? "" : `<div class="item acts"><input id="tmsg" placeholder="Mensagem direta para o departamento (orientação, informação que faltava…)"><button class="primary" onclick="taskMsg(${t.id})">Enviar</button><button class="bad" onclick="cancelTask(${t.id})">Cancelar tarefa</button></div>`}`);
}
async function taskMsg(id) { const m = $("#tmsg").value.trim(); if (!m) return; await api(`/api/tasks/${id}/message`, {method: "POST", body: JSON.stringify({message: m})}); closeModal(); refresh(); }
async function cancelTask(id) { if (!confirm("Cancelar esta tarefa?")) return; await api(`/api/tasks/${id}/cancel`, {method: "POST"}); closeModal(); refresh(); }
async function decide(id, approved) {
  const note = ($("#note" + id) || {}).value || "";
  try { await api(`/api/approvals/${id}`, {method: "POST", body: JSON.stringify({approved, note})}); } catch (e) { alert(e.message); }
  document.activeElement.blur(); refresh();
}
async function openReport(id) { const r = await api(`/api/reports/${id}`); modal(`<h2>${esc(r.title)}</h2><div class="d" style="color:var(--muted)">${when(r.created_at)}</div>${md(r.content)}`); }
async function openRec(id) {
  const r = await api(`/api/recommendations/${id}`);
  modal(`<h2>${esc(r.title)}</h2><div style="color:var(--muted)">${esc(DEPTS[r.department_id] || r.department_id)} · ${when(r.created_at)}</div>${md(r.content)}
    <p><button class="ok" onclick="setRec(${r.id},'aceita')">Aceitar</button> <button class="bad" onclick="setRec(${r.id},'descartada')">Descartar</button></p>`);
}
async function setRec(id, s) { await api(`/api/recommendations/${id}/${s}`, {method: "POST"}); closeModal(); refresh(); }
$("#btnReport").onclick = async () => { const r = await api("/api/reports/generate", {method: "POST"}); alert(r.message); };
async function logout() { await fetch("/api/logout", {method: "POST"}); location.reload(); }
async function showMemory() {
  const m = await api("/api/memory");
  modal(`<h2>Memória da empresa</h2>${m.map(x => `<div class="item"><div class="t">${esc(x.key)} <span class="tag">${esc(x.scope)}</span></div><div class="d">${esc(x.content)}</div><div class="d">${esc(x.author)} · ${when(x.updated_at)}</div></div>`).join("") || '<div class="empty">Vazia por enquanto. O MASON e os departamentos guardam aqui fatos importantes sobre a empresa.</div>'}`);
};
$("#btnSettings").onclick = () => {
  const s = window.SETTINGS || {};
  modal(`<h2>Configurações</h2>
    <p><label><input type="checkbox" id="sAuto" ${s.auto_review ? "checked" : ""}> MASON revisa cada entrega antes de marcar como concluída</label></p>
    <p><label>Relatório automático a cada <input type="number" id="sRep" min="0" step="1" value="${s.report_interval_hours || 0}" style="width:70px"> horas (0 = desligado)</label></p>
    <p><button class="primary" onclick="saveSettings()">Salvar</button></p>
    <p style="border-top:1px solid var(--line);padding-top:12px"><button onclick="showMemory()">Ver memória da empresa</button> <button class="bad" onclick="logout()">Sair</button></p>`);
};
async function saveSettings() { await api("/api/settings", {method: "POST", body: JSON.stringify({auto_review: $("#sAuto").checked, report_interval_hours: +$("#sRep").value})}); closeModal(); refresh(); }

$("#btnMemory").onclick = showMemory;

// ---------------- abas (celular)
document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => {
  document.body.className = "tab-" + b.dataset.tab;
  document.querySelectorAll("#tabs button").forEach(x => x.classList.toggle("on", x === b));
  if (b.dataset.tab === "chat") $("#msgs").scrollTop = 1e9;
});

// ---------------- login
let timer = null;
function showLogin() { $("#login").style.display = "flex"; clearInterval(timer); timer = null; setTimeout(() => (SESSION.mode === "firebase" ? $("#email") : $("#pw")).focus(), 50); }
let SESSION = {mode: "senha"}, fb = null;
async function firebase() {
  // SDK do Firebase Authentication empacotado junto com o app (/firebase-auth.js)
  if (fb) return fb;
  const m = await import("/firebase-auth.js");
  const c = SESSION.firebase;
  const app = m.initializeApp({apiKey: c.apiKey, authDomain: c.authDomain, projectId: c.projectId});
  const a = m.getAuth(app);
  if (c.emulatorHost) m.connectAuthEmulator(a, "http://" + c.emulatorHost, {disableWarnings: true});
  await m.setPersistence(a, m.browserSessionPersistence);
  return fb = {m, a};
}
const FB_ERRORS = {"auth/invalid-credential": "E-mail ou senha incorretos", "auth/wrong-password": "E-mail ou senha incorretos",
  "auth/user-not-found": "E-mail ou senha incorretos", "auth/too-many-requests": "Muitas tentativas. Tente mais tarde.",
  "auth/invalid-email": "E-mail inválido", "auth/network-request-failed": "Sem conexão com o Firebase", "auth/user-disabled": "Conta desativada"};
$("#loginForm").onsubmit = async e => {
  e.preventDefault(); $("#loginErr").textContent = ""; $("#loginBtn").disabled = true;
  try {
    let body = {password: $("#pw").value};
    if (SESSION.mode === "firebase") {
      const {m, a} = await firebase();
      const cred = await m.signInWithEmailAndPassword(a, $("#email").value.trim(), $("#pw").value);
      body = {id_token: await cred.user.getIdToken()};
      await m.signOut(a); // a partir daqui vale o cookie de sessão do MASON
    }
    const r = await fetch("/api/login", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || "Erro ao entrar");
    $("#login").style.display = "none"; $("#pw").value = ""; start();
  } catch (err) { $("#loginErr").textContent = FB_ERRORS[err.code] || err.message; }
  $("#loginBtn").disabled = false;
};
$("#forgot").onclick = async e => {
  e.preventDefault();
  const email = $("#email").value.trim(); if (!email) { $("#loginErr").textContent = "Digite seu e-mail primeiro"; return; }
  try { const {m, a} = await firebase(); await m.sendPasswordResetEmail(a, email); $("#loginErr").textContent = "Se o e-mail estiver cadastrado, você receberá um link para redefinir a senha."; }
  catch (err) { $("#loginErr").textContent = FB_ERRORS[err.code] || err.message; }
};
function start() { loadChat(); refresh(); if (!timer) timer = setInterval(refresh, 5000); }
fetch("/api/session").then(r => r.json()).then(s => {
  SESSION = s;
  const isFb = s.mode === "firebase";
  $("#email").hidden = !isFb; $("#forgotWrap").hidden = !isFb;
  s.logged_in ? start() : showLogin();
});
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
</script>
</body>
